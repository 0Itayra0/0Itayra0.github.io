<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | The Brawl League</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0f0f13;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .register-box {
      width: 100%;
      max-width: 500px;
      background-color: #1a1a24;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #f5d849;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: #0f0f13;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
    }
    input[name="playerTag"] { text-transform: uppercase; }
    .penalty-box {
      background-color: #232330;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
    }
    .penalty-box input[type="checkbox"] {
      margin-top: 4px;
      accent-color: #f5d849;
      width: 18px;
      height: 18px;
    }
    .penalty-box span {
      font-size: 13px;
      color: #ccc;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #f5d849;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.error {
      background-color: rgba(255, 59, 48, 0.1);
      border-left: 4px solid #ff3b30;
      color: #ff3b30;
    }
    .success-card {
      background-color: rgba(52, 199, 89, 0.1);
      border-left: 4px solid #34c759;
      padding: 20px;
      border-radius: 4px;
      text-align: center;
      display: none;
      transition: all 0.3s ease;
    }
    /* Participants Board Styles */
    .participants-section {
      width: 100%;
      max-width: 800px; 
      margin: 40px auto 0 auto;
    }
    .participants-header {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .player-card {
      background-color: #1a1a24;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .player-card:hover {
      transform: translateY(-3px);
      border-color: #f5d849;
    }
    .player-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #555;
      margin-bottom: 10px;
    }
    .player-name {
      font-weight: bold;
      font-size: 16px;
      margin: 0 0 5px 0;
      color: #fff;
    }
    .player-club {
      font-size: 12px;
      color: #aaa;
      margin: 0 0 10px 0;
    }
    .player-trophies {
      color: #f5d849;
      font-weight: bold;
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    .player-brawlers {
      width: 100%;
      font-size: 11px;
      color: #ccc;
      border-top: 1px solid #333;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div class="register-box">
    <h2>The Brawl League</h2>

    <div id="error-msg" class="alert error"></div>

    <div id="success-card" class="success-card">
      <h3 style="margin: 0 0 15px 0; color: #34c759;">Registration Confirmed!</h3>
      
      <img id="success-icon" src="" alt="Profile Icon" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 10px auto; display: none; border: 2px solid #f5d849;">
      
      <p id="success-name" style="margin: 5px 0; font-size: 18px; font-weight: bold;"></p>
      <p id="success-club" style="margin: 5px 0; color: #aaa;"></p>
      <p id="success-trophies" style="margin: 5px 0; color: #f5d849;"></p>
      
      <div id="success-brawlers" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 14px; color: #ccc;">
      </div>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label>Tournament Display Name</label>
        <input type="text" id="displayName" maxlength="25" required>
      </div>

      <div class="form-group">
        <label>Brawl Stars Player Tag</label>
        <input type="text" id="playerTag" placeholder="#P0LJQ28Y" required>
      </div>

      <label class="penalty-box">
        <input type="checkbox" id="agreedToPenalty" required>
        <span>
          I acknowledge that I will be blacklisted from future tournaments in case of not showing up on time without properly notifying administration in advance by at least 3 hours before the tournament starts (excluding emergencies).
        </span>
      </label>

      <button type="submit" id="submit-btn">Register Now</button>
    </form>
  </div>

  <div class="participants-section">
    <h2 class="participants-header">Main Bracket (<span id="confirmed-count">0</span>/<span id="max-count">32</span>)</h2>
    <div id="confirmed-grid" class="players-grid"></div>

    <h2 class="participants-header" style="margin-top: 50px; color: #aaa; border-bottom-color: #444;">
      Waitlist (<span id="waitlist-count">0</span>)
    </h2>
    <div id="waitlist-grid" class="players-grid" style="opacity: 0.7;"></div>
  </div>

  <script>
    // Helper function to format the HTML for the top 3 brawlers using official IDs
    function generateBrawlersHTML(topBrawlers) {
      let html = '';
      if (topBrawlers && topBrawlers.length > 0) {
        topBrawlers.forEach(b => {
          if (!b.id) {
            html += `<div style="color:#aaa; font-size:13px; margin-bottom:4px;">${b.name} - 🏆 ${b.trophies}</div>`;
            return;
          }

          const imgSrc = `https://cdn.brawlify.com/brawlers/borderless/${b.id}.png`;
          
          html += `
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05);">
              <div style="display: flex; align-items: center; gap: 8px;">
                <img src="${imgSrc}" onerror="this.style.display='none'" style="width: 22px; height: 22px; border-radius: 4px; background-color: rgba(0,0,0,0.3);">
                <span style="color: #eee; font-weight: 500;">${b.name}</span>
              </div>
              <span style="color: #f5d849; font-weight: bold;">🏆 ${b.trophies.toLocaleString()}</span>
            </div>
          `;
        });
      } else {
        html = '<div style="text-align: center; color: #555;">Hidden Profiles</div>';
      }
      return html;
    }

    async function loadParticipants() {
      const confirmedGrid = document.getElementById('confirmed-grid');
      const waitlistGrid = document.getElementById('waitlist-grid');
      
      try {
        const response = await fetch('http://localhost:5000/api/players');
        const data = await response.json();
        
        if (data.success) {
          // Update the counters
          document.getElementById('confirmed-count').textContent = data.confirmedCount;
          document.getElementById('max-count').textContent = data.maxPlayers;
          document.getElementById('waitlist-count').textContent = data.waitlistCount;
          
          confirmedGrid.innerHTML = ''; 
          waitlistGrid.innerHTML = ''; 

          // Helper to create and inject cards
          const renderCard = (player, container) => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
              <img class="player-avatar" src="https://cdn.brawlify.com/profile-icons/regular/${player.stats.iconId}.png" alt="Avatar">
              <p class="player-name">${player.displayName}</p>
              <p class="player-club">${player.stats.clubName || 'No Club'}</p>
              <p class="player-trophies">🏆 ${player.stats.trophies.toLocaleString()}</p>
              <div class="player-brawlers">
                ${generateBrawlersHTML(player.stats.topBrawlers)}
              </div>
            `;
            container.appendChild(card);
          };

          // Render both lists
          data.confirmed.forEach(p => renderCard(p, confirmedGrid));
          data.waitlisted.forEach(p => renderCard(p, waitlistGrid));
        }
      } catch (err) {
        confirmedGrid.innerHTML = '<p style="color: red; text-align: center; width: 100%;">Failed to load roster.</p>';
      }
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');
      const form = document.getElementById('register-form');
      const successCard = document.getElementById('success-card');

      const displayName = document.getElementById('displayName').value;
      let playerTag = document.getElementById('playerTag').value.trim().toUpperCase();
      const agreedToPenalty = document.getElementById('agreedToPenalty').checked;

      if (!playerTag.startsWith('#')) playerTag = '#' + playerTag;

      errorMsg.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verifying Tag...';

      try {
        const response = await fetch('http://localhost:5000/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName, playerTag, agreedToPenalty })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.message || 'Registration failed.');

        form.style.display = 'none';
        successCard.style.display = 'block';

        // Waitlist vs Confirmed Color Logic
        const successTitle = document.querySelector('#success-card h3');
        if (data.player.status === 'waitlisted') {
          successTitle.textContent = 'Added to Waitlist!';
          successTitle.style.color = '#ff9f0a';
          successCard.style.borderLeftColor = '#ff9f0a';
          successCard.style.backgroundColor = 'rgba(255, 159, 10, 0.1)';
        } else {
          successTitle.textContent = 'Registration Confirmed!';
          successTitle.style.color = '#34c759';
          successCard.style.borderLeftColor = '#34c759';
          successCard.style.backgroundColor = 'rgba(52, 199, 89, 0.1)';
        }
        
        document.getElementById('success-name').textContent = data.player.displayName;
        document.getElementById('success-club').textContent = 'Club: ' + (data.player.clubName || 'None');
        document.getElementById('success-trophies').textContent = '🏆 ' + data.player.trophies.toLocaleString();
        
        const iconImg = document.getElementById('success-icon');
        iconImg.src = `https://cdn.brawlify.com/profile-icons/regular/${data.player.iconId}.png`;
        iconImg.style.display = 'block';

        const brawlersDiv = document.getElementById('success-brawlers');
        brawlersDiv.innerHTML = '<strong style="color: #fff;">Top 3 Brawlers:</strong><br><br>' + generateBrawlersHTML(data.player.topBrawlers);

        loadParticipants();

      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Register Now';
      }
    });

    loadParticipants();
  </script>

</body>
</html>
